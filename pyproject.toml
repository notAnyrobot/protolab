[build-system]
requires = ["setuptools>=69.5.1"]
build-backend = "setuptools.build_meta"

[project]
name = "protolab"
version = "0.1.0"
description = "An independent playground for ProtoMotions experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["protomotions==3.1.0"]

# The supported installation is one Linux x86_64 IsaacLab/PhysX environment.
# Keeping the simulator stack in a default group makes plain `uv sync` install it
# while leaving ProtoLab's published package metadata small and source-agnostic.
[dependency-groups]
isaaclab = [
    "protomotions[isaaclab]==3.1.0",
    # IsaacLab source packages from the pinned checkout.
    "isaaclab==12.0.0",
    "isaaclab-assets==0.4.2",
    "isaaclab-contrib==0.4.7",
    "isaaclab-experimental==0.1.2",
    "isaaclab-newton==1.9.1",
    "isaaclab-ov==0.7.1",
    "isaaclab-ovphysx==6.3.1",
    "isaaclab-physx==2.9.1",
    "isaaclab-ppisp==0.3.0",
    "isaaclab-rl==0.7.0",
    "isaaclab-tasks==8.1.9",
    "isaaclab-tasks-experimental==0.0.1",
    "isaaclab-visualizers==1.1.1",
    # Isaac Sim and the tested CUDA/Python ABI stack.
    "isaacsim[all,extscache]==6.0.0.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "warp-lang==1.15.0.dev20260626",
    "newton[sim]==1.2.0",
    "newton-usd-schemas==0.2.0",
    # Tested resolutions for the conflicts in the two upstream manifests.
    "numpy==2.3.1",
    "pillow==12.1.1",
    "hydra-core==1.3.6",
    "omegaconf==2.3.0",
    "tensordict==0.9.0",
    "protobuf==6.33.6",
    "pytetwild==0.2.3",
    "moviepy>=2,<3",
    "lxml==6.1.3",
    "decorator==4.4.2",
    # Base runtime requirements centralized by the pinned IsaacLab checkout.
    "onnx>=1.18.0",
    "prettytable>=3.3.0",
    "psutil",
    "hidapi>=0.14.0",
    "gymnasium>=1.2.0",
    "trimesh",
    "pyglet>=2.1.6,<3",
    "transformers==4.57.6",
    "einops",
    "matplotlib>=3.10.3",
    "botocore",
    "starlette>=0.46.0,<0.50",
    "omniverseclient==2.71.1.7015",
    "filelock",
    "lazy-loader>=0.4",
    "pin",
    "pin-pink==3.3.0",
    "daqp==0.8.5",
    "usd-core>=25.11,<26.0",
    "hf-xet>=1.4.1,<2.0.0",
    "tensorboard",
    "numba>=0.63.1",
    "h5py>=3.15.0",
    "packaging",
    "tqdm>=4.67.1",
    # Only RSL-RL from IsaacLab's RL-framework choices; omit sb3/skrl/rl-games extras.
    "rsl-rl-lib==5.5.1",
    "onnxscript>=0.5",
    "pyopengl-accelerate>=3.1.0",
    "imgui-bundle>=1.92.5",
    "typing-extensions>=4.12.2",
    # ProtoMotions' requirements_isaaclab.txt additions not already above.
    "wheel",
    "scipy>=1.11",
    "scikit-image",
    "rtree>=1.2",
    "setuptools>=69.5.1",
    "pyyaml>=6",
    "rich",
    "typer>=0.6.1",
    "easydict",
    "wandb>=0.23,<0.24",
    "sentry-sdk>=2.0.0",
    "dm-control>=1.0",
]

[project.scripts]
train = "protolab.cli:train"
inference = "protolab.cli:inference"

[tool.setuptools.packages.find]
where = ["src"]
include = ["protolab*"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
required-version = ">=0.12.10"
default-groups = ["isaaclab"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
index-strategy = "unsafe-best-match"
prerelease = "allow"
python-preference = "only-managed"

[tool.uv.sources]
protomotions = { path = "external/ProtoMotions", editable = true }
isaaclab = { path = "external/IsaacLab/source/isaaclab", editable = true }
isaaclab-assets = { path = "external/IsaacLab/source/isaaclab_assets", editable = true }
isaaclab-contrib = { path = "external/IsaacLab/source/isaaclab_contrib", editable = true }
isaaclab-experimental = { path = "external/IsaacLab/source/isaaclab_experimental", editable = true }
isaaclab-newton = { path = "external/IsaacLab/source/isaaclab_newton", editable = true }
isaaclab-ov = { path = "external/IsaacLab/source/isaaclab_ov", editable = true }
isaaclab-ovphysx = { path = "external/IsaacLab/source/isaaclab_ovphysx", editable = true }
isaaclab-physx = { path = "external/IsaacLab/source/isaaclab_physx", editable = true }
isaaclab-ppisp = { path = "external/IsaacLab/source/isaaclab_ppisp", editable = true }
isaaclab-rl = { path = "external/IsaacLab/source/isaaclab_rl", editable = true }
isaaclab-tasks = { path = "external/IsaacLab/source/isaaclab_tasks", editable = true }
isaaclab-tasks-experimental = { path = "external/IsaacLab/source/isaaclab_tasks_experimental", editable = true }
isaaclab-visualizers = { path = "external/IsaacLab/source/isaaclab_visualizers", editable = true }
moviepy = { url = "https://github.com/Zulko/moviepy/archive/97316f37f6a8d3843abfb53eba8f3bb0ea46a008.tar.gz" }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
